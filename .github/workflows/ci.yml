name: Institutional Regression

on:
  pull_request:
  push:
    branches:
      - main
      - publish-live
  workflow_dispatch:

jobs:
  regression:
    name: Regression, rules, and functions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            tests/rules/package-lock.json

      - name: Set up Java 21 for Firebase Emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Firestore rules test dependencies
        run: npm ci --prefix tests/rules

      - name: Install Functions dependencies
        run: npm install --prefix functions

      - name: JavaScript syntax check
        run: npm run check:js

      - name: Financial regression tests
        run: npm run test:financial

      - name: Domain and XIRR verification suites
        run: npm run test:domain

      - name: Feature regression tests
        run: npm run test:features

      - name: Functions syntax checks
        run: npm run test:functions

      - name: Firestore security rules regression tests
        run: npm run test:rules

      - name: Firestore load and stress smoke
        run: npm run test:load

      - name: Performance smoke test
        run: npm run test:performance
